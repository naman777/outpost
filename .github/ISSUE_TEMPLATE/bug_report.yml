name: Bug report
description: Report a reproducible problem using fictional data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities use the private reporting link in SECURITY.md. Never include secrets or real inbox data."
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal example with fictional data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, operating system, hosting platform, and mailbox provider. Do not include connection strings or credentials.
    validations:
      required: true
